<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta e navegação 3D</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#18232d;color:#fff;font:16px system-ui;height:100dvh;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #60768a;border-radius:8px;background:#344d62;color:white;min-height:44px;padding:8px;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #ffc66d}#consult{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:clamp(10px,2vw,24px)}h1{font-size:clamp(20px,3vw,36px);margin:0}p{margin:4px 0}#panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;min-height:0}#keyboardPanel,#searchPanel{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}#keyboard{display:grid;gap:6px;flex:1;min-height:0}.keys{display:flex;gap:4px;min-height:0}.keys button{flex:1;min-width:0;min-height:0;padding:4px;font-size:clamp(12px,2vw,24px)}#actions{display:flex;gap:6px}#actions button{flex:1}#search{width:100%;padding:12px;border-radius:8px;border:0;color:#142637;background:#fff}#results{display:grid;align-content:start;gap:7px;overflow:auto;min-height:0;flex:1}#results button{text-align:left;background:#294358;padding:12px}#feedback{color:#ffdb9c;min-height:1.2em}footer{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:14px}#file{max-width:200px}#navigation{height:100%;display:flex;flex-direction:column}#view{flex:1;min-height:0;position:relative}canvas{display:block;width:100%;height:100%}#navBar{display:flex;align-items:center;gap:12px;padding:8px;flex-wrap:wrap}#status{flex:1}#stop{background:#a33d38} @media(max-width:650px) and (orientation:portrait){#panels{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}#searchPanel{grid-row:1}#consult{gap:6px}#actions button{min-height:36px}footer{font-size:12px}}
</style></head><body><main id="consult"><div><h1>Onde você deseja ir?</h1><p>Digite o nome do destino e toque no resultado para iniciar a navegação.</p></div><div id="panels"><section id="keyboardPanel" aria-label="Teclado virtual"><div id="keyboard"></div><div id="actions"><button id="space">Espaço</button><button id="backspace">Apagar</button><button id="clear">Limpar</button></div></section><section id="searchPanel"><input id="search" type="search" inputmode="none" autocomplete="off" aria-label="Pesquisar destino" placeholder="Pesquisar destino"><div id="feedback" role="status"></div><div id="results">Carregando mapa…</div></section></div><footer><label>Mapa JSON <input id="file" type="file" accept=".json"></label><label>Qualidade <select id="quality"><option value="auto">Automática</option><option value="low">Baixa</option><option value="high">Alta</option></select></label><select id="dest" hidden aria-label="Destino"></select><button id="go" hidden>Navegar</button></footer></main><section id="navigation" hidden><div id="view"></div><div id="navBar"><div id="status" role="status">Carregando...</div><button id="stop">Voltar à consulta</button></div></section><script type="module" src="app.js?v=consulta-touch-1"></script></body></html>
