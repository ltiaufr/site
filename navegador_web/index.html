<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta e navegação 3D</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#18232d;color:#fff;font:16px system-ui;height:100dvh;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #60768a;border-radius:8px;background:#344d62;color:white;min-height:44px;padding:8px;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #ffc66d}#consult{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding:clamp(10px,2vw,24px)}h1{font-size:clamp(20px,3vw,36px);margin:0}p{margin:4px 0}#panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;min-height:0}#keyboardPanel,#searchPanel{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}#keyboard{display:grid;gap:6px;flex:1;min-height:0}.keys{display:flex;gap:4px;min-height:0}.keys button{flex:1;min-width:0;min-height:0;padding:4px;font-size:clamp(12px,2vw,24px)}#actions{display:flex;gap:6px}#actions button{flex:1}#search{width:100%;padding:12px;border-radius:8px;border:0;color:#142637;background:#fff}#results{display:grid;align-content:start;gap:7px;overflow:auto;min-height:0;flex:1}#results button{text-align:left;background:#294358;padding:12px}#feedback{color:#ffdb9c;min-height:1.2em}footer{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:14px}#file{max-width:200px}#navigation{height:100%;display:flex;flex-direction:column}#view{flex:1;min-height:0;position:relative}canvas{display:block;width:100%;height:100%}#navBar{display:flex;align-items:center;gap:12px;padding:8px;flex-wrap:wrap}#status{flex:1}#stop{background:#a33d38} @media(max-width:650px) and (orientation:portrait){#panels{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}#searchPanel{grid-row:1}#consult{gap:6px}#actions button{min-height:36px}footer{font-size:12px}}

/* Consulta institucional: relevo claro, baseado no terminal local. */
#consult{--surface:#e9eef5;--shade:#cbd3de;--light:#fff;--ink:#24354c;--gap:clamp(6px,1.4vmin,16px);background:var(--surface);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;gap:var(--gap);padding:clamp(10px,2vmin,24px)}
#consult>header{border-radius:16px;text-align:center;padding:clamp(8px,2vmin,22px);box-shadow:6px 6px 14px var(--shade),-6px -6px 14px var(--light)}
#consult h1{font-size:clamp(18px,3.6vmin,38px);letter-spacing:-.5px}
#consult h2{margin:0;font-size:clamp(14px,2.5vmin,23px)}
#consult p{color:#596d84;font-size:clamp(11px,1.9vmin,16px)}
#panels{grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:var(--gap)}
#keyboardPanel,#searchPanel{padding:clamp(8px,2vmin,24px);border-radius:18px;box-shadow:8px 8px 18px var(--shade),-8px -8px 18px var(--light);gap:var(--gap)}
#consult button{border:0;background:var(--surface);color:var(--ink);border-radius:clamp(5px,1.5vmin,12px);box-shadow:4px 4px 8px var(--shade),-4px -4px 8px var(--light);font-weight:700;min-height:0}
#consult button:active{box-shadow:inset 4px 4px 8px var(--shade),inset -4px -4px 8px var(--light);transform:scale(.98)}
#consult button:focus-visible,#search:focus-visible{outline:2px solid #3278b7;outline-offset:2px}
#keyboard{grid-template-rows:repeat(4,minmax(0,1fr));gap:var(--gap)}
.keys{gap:clamp(4px,1vmin,10px)}
.keys button{font-size:clamp(13px,3vmin,26px)}
.keys:last-child button{background:#dce6f1;color:#234e78}
#actions{gap:var(--gap);flex-wrap:wrap}
#actions button{min-height:clamp(30px,6vmin,54px);font-size:clamp(11px,2.1vmin,18px);color:#285e92}
#actions #space{flex:1 0 100%;order:3}
#searchPanel label{font-size:clamp(11px,1.9vmin,15px);font-weight:600}
#search{background:var(--surface);color:var(--ink);box-shadow:inset 6px 6px 12px var(--shade),inset -6px -6px 12px var(--light);height:clamp(36px,8vmin,70px);flex-shrink:0;padding:0 18px;border-radius:16px;font-size:clamp(13px,2.4vmin,20px)}
#search::placeholder{color:#65788f}
#feedback{color:#a84c43;min-height:0;font-size:clamp(11px,1.9vmin,15px)}
#feedback:empty{display:none}
#results{display:flex;flex-direction:column;gap:var(--gap);padding:6px 9px 9px 6px;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-y}
#results::-webkit-scrollbar{display:none}
#results button{flex-shrink:0;background:var(--surface);min-height:clamp(38px,7vmin,68px);font-size:clamp(13px,2.3vmin,19px);padding:10px 16px;overflow-wrap:anywhere}
#results button::before{content:"⌖";color:#3278b7;margin-right:12px;font-size:1.25em}
@media(orientation:portrait){#panels{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}#searchPanel{grid-row:1}#consult>header p{margin:2px 0}#actions button{min-height:clamp(24px,4vmin,44px)}}
</style></head><body><main id="consult"><header><h1>Sistema de Navegação Institucional</h1><p>Digite o nome do destino e toque no resultado para escolher a consulta 2D ou 3D.</p></header><div id="panels"><section id="keyboardPanel" aria-label="Teclado virtual"><h2>Teclado virtual</h2><div id="keyboard"></div><div id="actions"><button id="space">Espaço</button><button id="backspace">Apagar</button><button id="clear">Limpar</button></div></section><section id="searchPanel"><h2>Pesquisar locais</h2><label for="search">Nome ou parte do nome do destino</label><input id="search" type="search" inputmode="none" autocomplete="off" aria-label="Pesquisar destino" placeholder="Ex.: biblioteca, laboratório, sala..."><div id="feedback" role="status"></div><div id="results">Carregando mapa…</div></section></div><footer hidden aria-hidden="true"><label>Mapa JSON <input id="file" type="file" accept=".json"></label><label>Qualidade <select id="quality"><option value="auto">Automática</option><option value="low">Baixa</option><option value="high">Alta</option></select></label><select id="dest" hidden aria-label="Destino"></select><button id="go" hidden>Navegar</button></footer></main><section id="navigation" hidden><div id="view"></div><div id="navBar"><div id="status" role="status">Carregando...</div><button id="stop">Voltar à consulta</button></div></section><script type="module" src="app.js?v=vegetacao-cerca-1"></script></body></html>
